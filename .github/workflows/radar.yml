name: Promo Radar
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: true
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Git identity
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
      - run: python radar.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
      - name: Save state
        if: always()
        run: |
          git add state.json || true
          git commit -m "state" || true
          git pull --rebase || true
          git push || true